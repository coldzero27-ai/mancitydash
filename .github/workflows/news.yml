name: Refresh news feeds

on:

  schedule:

    - cron: "*/30 * * * *"   # every 30 min; board's freshness gate is 45 min

  workflow_dispatch: {}

permissions:

  contents: write

jobs:

  news:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Fetch news

        run: python3 fetch_news.py

      - name: Commit if changed

        run: |

          git config user.name "dashboard-bot"

          git config user.email "bot@users.noreply.github.com"

          git add feeds.json

          git diff --cached --quiet || git commit -m "news refresh"

          git push