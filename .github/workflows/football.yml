name: Refresh football.json

on:

  schedule:

    - cron: "17 2,8,14,20 * * *"   # 4x daily (UTC)

  workflow_dispatch: {}

permissions:

  contents: write

jobs:

  fetch:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Fetch API-Football

        env:

          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

        run: python3 fetch_football.py

      - name: Fetch ScoreBat

        continue-on-error: true      # video fallback must never block the football data

        env:

          SCOREBAT_TOKEN: ${{ secrets.SCOREBAT_TOKEN }}

        run: python3 fetch_scorebat.py

      - name: Commit if changed

        run: |

          git config user.name "dashboard-bot"

          git config user.email "bot@users.noreply.github.com"

          git add football.json scorebat.json

          git diff --cached --quiet || git commit -m "data refresh"

          git push
