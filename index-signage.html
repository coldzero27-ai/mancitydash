<!--
  CFG / MAN CITY WALL DASHBOARD — v1 (company edition, monogram crests)
  ---------------------------------------------------------------------
  DATA SOURCES (verified 4 Jul 2026):
   - Man City 2026/27 PL fixtures: premierleague.com fixture release + mancity.com
   - Community Shield: Arsenal v Man City, Sun 16 Aug 2026, Principality Stadium,
     15:00 UK -> 18:00 GST (Sky Sports / skysports.com)
   - Cup entry points: Carabao Round 3 (w/c 7 & 14 Sep), FA Cup Round 3 (9/10 Jan 2027),
     UCL league phase 8 Sep 2026 - 27 Jan 2027 (skysports.com)
   - Girona relegated to Segunda Division (19th, 2025/26 La Liga - Wikipedia/BBC)
   - Palermo remain in Serie B (4th, lost promotion playoff SF - football-italia)
  All times shown in GST (UTC+4). Fixtures stored as UTC and converted at render,
  so date rollovers are always correct.

  LIVE DATA: this file never invents numbers. It looks for two optional files
  sitting next to index.html (GitHub Pages pattern), silently, with cache-busters:
    results.json  - refetched every 5 min
    news.json     - refetched every 30 min
  results.json schema:
  {
    "updated": "2026-08-23T18:00:00Z",
    "mancity": {
      "position": 1, "played": 1, "points": 3,
      "form": ["W"],
      "topScorer": "Haaland - 1", "topAssists": "Foden - 1",
      "table": [ {"pos":1,"team":"Man City","pts":3}, ... up to 4 rows ],
      "comps": { "PL":"1st", "UCL":"MD1 - 15 Sep", "FA":"Holders - Round 3 Jan",
                 "EFL":"Round 3 - 22 Sep", "SHIELD":"Winners" },
      "fixtures": [ {"utc":"2026-08-29T14:00:00Z","comp":"PL","home":"Crystal Palace",
                     "away":"Man City","venue":"Selhurst Park"} ],
      "results": { "2026-08-16": {"score":"3-0","res":"L","fr":false} }
      (results = manual score override by GST date; outranks both live sources;
       scores display ONLY when TheSportsDB and ESPN agree, or via this map)
    },
    "clubs": { "GIR": {"league":"Segunda Division","pos":"3rd","form":["W","D","W"],
               "next":{"utc":"...","opp":"...","home":true}}, ... }
  }
  news.json schema: { "items": ["Headline one", "Headline two", ...] }
-->
<style>
:root{
  /* Manchester City brand guidelines: Sky #6CADDF, Midnight #001838, Electric #3BD6FF, White */
  --bg:#001838; --midnight:#001838; --panel:rgba(108,173,223,0.12); --panel-strong:rgba(108,173,223,0.2);
  --line:rgba(108,173,223,0.42); --line-strong:rgba(108,173,223,0.68);
  --sky:#6CADDF; --skydeep:#6CADDF; --electric:#3BD6FF; --ice:#FFFFFF; --steel:#6CADDF;
  --gold:#3BD6FF; /* highlight role now Electric Blue - var name kept for sweep */
  --win:#57C08D; --draw:#6CADDF; --loss:#DB6B58;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Inter',sans-serif;color:var(--ice)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden}
/* animated backdrop (placeholder until Flow video) */
#bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}
body.hasvideo #bgvid{display:block}
body.bg-photo #bgvid{display:none}
#bgphoto,#bgbrand{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.bg-photo #bgphoto{display:block}
body.bg-brand #bgbrand{display:block}
body.bg-brand #bgvid{display:none}
body.hasphoto .aurora{display:none}
.aurora{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
.a1{width:1100px;height:1100px;background:#123a63;left:-300px;top:-400px;animation:drift1 46s ease-in-out infinite alternate}
.a2{width:900px;height:900px;background:#0d5f8f;right:-250px;bottom:-350px;animation:drift2 58s ease-in-out infinite alternate}
.a3{width:520px;height:520px;background:#1c2c5b;left:38%;top:30%;animation:drift1 70s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(140px,90px) scale(1.12)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-120px,-70px) scale(.95)}}
#tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(9,26,44,.3) 0%,rgba(6,18,32,.74) 100%);transition:background .5s;z-index:1}
body.tint-light #tint{background:radial-gradient(ellipse at 50% 42%,rgba(9,26,44,.14) 0%,rgba(6,18,32,.56) 100%)}
body.tint-dark #tint{background:radial-gradient(ellipse at 50% 42%,rgba(9,26,44,.48) 0%,rgba(6,18,32,.86) 100%)}
.layer{position:relative;z-index:2}
.glass{background:linear-gradient(160deg,rgba(0,24,56,0.68),rgba(0,24,56,0.86));border:1px solid var(--line);border-radius:16px;-webkit-;}
.label{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.18em;color:var(--steel);font-size:20px}
/* brand color mode: cards #001838, titles #3BD6FF, in-card text #6CADDF; news card + accents untouched */
body.brand .glass{background:linear-gradient(160deg,rgba(0,24,56,.9),#001838);color:#6CADDF}
body.brand .glass .label{color:#3BD6FF}
body.brand #nc-comp{color:#3BD6FF}
body.brand #fxlist{color:#6CADDF}
body.brand .fxcard .fc-side span{color:#6CADDF}
body.brand #newscard{background:linear-gradient(160deg,rgba(0,24,56,0.5),rgba(0,24,56,0.74));color:inherit}
body.brand #newscard .label{color:var(--steel)}
/* header */
#hdr{height:96px;display:flex;align-items:center;padding:0 44px;border-bottom:1px solid var(--line);background:rgba(0,24,56,0.62);-webkit-;}
#brand{width:360px;display:flex;align-items:center}
#cfglogo{height:76px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
#cfwrap{flex:1;height:100%;position:relative;perspective:900px;overflow:hidden}
.crest{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.crestimg{object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));flex:0 0 auto}
#clockbox{width:360px;text-align:right}
#clock{font-family:'Barlow Condensed';font-weight:700;font-size:52px;line-height:1;color:var(--ice)}
#clock small{font-size:22px;color:var(--gold);font-weight:600;margin-left:8px}
#dateline{font-size:16px;color:var(--steel);letter-spacing:.12em;margin-top:4px;text-transform:uppercase}
/* main */
#main{flex:1;display:flex;gap:26px;padding:26px 44px;min-height:0}
#hero{flex:1.72;display:flex;flex-direction:column;gap:20px;min-width:0}
#nextcard{flex:1.35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;background:linear-gradient(160deg,rgba(108,171,221,0.3),rgba(28,60,92,0.42))}
#nc-comp{font-family:'Barlow Condensed';font-weight:600;font-size:24px;letter-spacing:.3em;color:var(--steel)}
#nc-teams{display:flex;align-items:center;gap:36px}
#nc-title{font-family:'Barlow Condensed';font-weight:700;font-size:70px;line-height:1;color:var(--ice);white-space:nowrap}
#nc-meta{font-size:23px;color:var(--sky)}
#nc-count{font-family:'Barlow Condensed';font-weight:700;font-size:52px;color:var(--gold);letter-spacing:.06em}
#nc-note{position:absolute;right:22px;top:16px;font-size:14px;color:var(--steel)}
#midrow{display:flex;gap:20px;height:252px;perspective:1600px}
#flipcard{flex:1.02;padding:10px 16px;display:flex;flex-direction:column;transition:transform .5s ease;transform-style:preserve-3d;backface-visibility:hidden;min-width:0}
#face-titles,#face-tw{display:flex;flex-direction:column;flex:1;min-height:0}
#trophycard{flex:1;display:flex;flex-direction:column;justify-content:space-between;margin-top:8px}
#newscard{flex:1.25;min-width:0;overflow:hidden;position:relative}
#vidcard{flex:1;min-width:0;overflow:hidden;position:relative;padding:0}
#newsbody{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding:4px 0}
#news-fresh{position:absolute;top:10px;right:14px;font-family:'Barlow Condensed';font-weight:600;font-size:14px;letter-spacing:.1em}
#news-fresh.live{color:var(--electric)}
#news-fresh.cached{color:var(--sky)}
#news-fresh.seed{color:var(--steel)}
.news-row{font-size:19px;color:#DCEBF8;line-height:1.4;padding-left:12px;border-left:2px solid rgba(152,197,233,.4);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.news-row.lead{font-size:21px;font-weight:500;color:var(--gold);border-left:3px solid var(--gold)}
.news-row.dim{color:var(--steel);border-left-color:rgba(152,197,233,.22)}
#vidbody{position:absolute;inset:0;cursor:pointer}
#vid-img{width:100%;height:100%;object-fit:cover;display:block}
#news-iframe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;pointer-events:auto}
#news-img{width:100%;height:108px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#news-iframe{width:100%;height:108px;border-radius:10px;border:1px solid var(--line)}
#news-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:44px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.85)}
#vid-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vid-cap{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;font-size:14px;color:#EAF4FF;
 background:linear-gradient(transparent,rgba(0,10,26,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;z-index:2}

.trow{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.trow svg{flex:0 0 auto}
.trow .cn{font-family:'Barlow Condensed';font-weight:600;font-size:17px;letter-spacing:.04em;color:var(--sky);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .cd{color:var(--ice);white-space:nowrap;font-size:16px}
.trow.hot .cn{color:var(--gold)}
.trow.hot .cd{color:var(--gold)}
#compstrip{display:none;gap:14px;height:84px}
.chip{flex:1;border-radius:12px;background:linear-gradient(160deg,rgba(0,24,56,0.5),rgba(0,24,56,0.74));border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;-webkit-;}
.chip .n{font-family:'Barlow Condensed';font-weight:600;font-size:21px;letter-spacing:.14em;color:var(--sky)}
.chip .v{font-size:16px;color:var(--ice);text-align:center;line-height:1.25}
.chip.hot{background:rgba(59,214,255,.13);border-color:var(--gold)}
.chip.hot .n{color:var(--gold)}
#fixstrip{display:none}
.fx{flex:1;border-radius:12px;background:linear-gradient(160deg,rgba(0,24,56,0.5),rgba(0,24,56,0.74));border:1px solid var(--line);-webkit-;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px}
.fx.next{border-color:var(--gold);background:rgba(59,214,255,.10)}
.fx .d{font-family:'Barlow Condensed';font-weight:600;font-size:19px;color:var(--sky);letter-spacing:.08em}
.fx.next .d{color:var(--gold)}
.fx .o{font-size:17px;color:var(--ice);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .t{font-size:15px;color:var(--steel)}
#herorow{flex:1;display:flex;gap:20px;min-height:0}
.twcols{display:flex;gap:0;height:100%}
.twcol{flex:1;padding:0 16px;display:flex;flex-direction:column;gap:8px}
.twcol+.twcol{border-left:1px solid var(--line)}
.twh{font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.2em}
.twh.in{color:var(--win)} .twh.out{color:var(--loss)}
.twn{font-size:16px;color:var(--ice);line-height:1.3;break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.twcol{overflow:hidden;min-width:0}
.twlist{overflow:hidden}
.twlist.two{column-count:2;column-gap:12px}
.twlist.two .twn{font-size:14px}
.twn small{color:var(--steel);font-size:15px}
.hcard{flex:1;padding:18px 22px;display:flex;flex-direction:column;min-width:0}
.hcard .body{margin-top:12px;font-size:19px;line-height:1.75;color:#DCEBF8;overflow:hidden}
.frow{display:flex;gap:9px}
.statdiv{display:none}
.statface{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#1a3050}
.statface.gold{border:2.5px solid var(--gold)}
.statface.sky{border:2.5px solid var(--sky)}
.stath{font-family:'Barlow Condensed';font-weight:600;font-size:18px;letter-spacing:.16em}
.stath.gold{color:var(--gold)} .stath.sky{color:var(--sky)}
.statn{font-size:21px;color:var(--ice)}
.statn b{font-weight:600}
.statn b.gold{color:var(--gold)} .statn b.sky{color:var(--sky)}
#form-note{font-size:14px;color:var(--steel)}
.fdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:19px;color:#06121f}
.tag{display:inline-block;min-width:52px;text-align:center;border-radius:6px;padding:1px 8px;font-family:'Barlow Condensed';font-weight:600;font-size:17px;letter-spacing:.08em;margin-right:10px}
.tag.PL{background:rgba(59,214,255,.2);color:var(--gold)}
.tag.UCL{background:rgba(108,171,221,.22);color:var(--sky)}
.tag.FA{background:rgba(196,168,238,.2);color:#C4A8EE}
.tag.EFL{background:rgba(158,225,203,.18);color:#9FE1CB}
.tag.SHIELD{background:rgba(240,153,123,.18);color:#F0997B}
.tag.FR{background:rgba(166,200,228,.18);color:#A6C8E4}
#herorow{display:flex;gap:20px;height:172px;perspective:1600px}
#statscard{flex:0.9;display:flex;flex-direction:column;gap:2px;min-width:0;padding:10px 16px}
#spot{flex:1.02;overflow:hidden}
.vrow{display:flex;align-items:center;gap:10px;flex:1;min-height:0}
.vk{font-family:'Barlow Condensed';font-weight:600;font-size:18px;letter-spacing:.14em;color:var(--steel);width:72px}
.statblk{display:flex;align-items:center;gap:14px}
.statblk.sm .statface{width:40px;height:40px}
.statblk.sm .stath{font-size:15px}
.statblk.sm .statn{font-size:19px}
#standings{padding:16px 20px;display:flex;flex-direction:column;min-height:0}
#plTable{margin-top:8px;flex:1;display:flex;flex-direction:column;justify-content:space-between;font-size:17px;min-height:0}
.plrow{display:flex;align-items:center;gap:9px;padding:3px 8px;border-radius:8px;color:#DCEBF8}
.plrow.head{color:var(--steel);font-family:'Barlow Condensed';font-weight:600;letter-spacing:.1em;font-size:15px}
.plrow.me{background:linear-gradient(90deg,rgba(59,214,255,.28),rgba(59,214,255,.10));color:#fff;font-weight:700;
 border:1px solid rgba(59,214,255,.55);box-shadow:0 0 14px rgba(59,214,255,.22);font-size:19px;padding:6px 8px}
.plrow.me .pr{color:var(--electric);font-size:22px}
.plrow .pr{width:24px;text-align:right;font-family:'Barlow Condensed';font-weight:600}
.plrow .pn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.plrow .pc{width:36px;text-align:center}
.plrow .pp{width:42px;text-align:center;font-weight:700;color:var(--electric)}
.plrow.me .pp{color:#fff}
#fxhead{display:flex;align-items:center;justify-content:space-between}
#fxToggle{background:rgba(0,24,56,.5);border:1px solid var(--line);color:var(--electric);border-radius:999px;padding:4px 16px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
#fxcal{margin-top:8px;flex:1;min-height:0;overflow:hidden}
#cal-month{text-align:center;font-family:'Barlow Condensed';font-weight:600;font-size:22px;letter-spacing:.2em;color:var(--sky);margin-bottom:7px}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
#cal-grid.r6{gap:5px}
.cal-dow{font-size:12px;color:var(--steel);text-align:center;font-family:'Barlow Condensed';font-weight:600;letter-spacing:.14em;align-self:end;padding-bottom:1px}
.cal-day{position:relative;border-radius:12px;min-height:53px;padding:3px 7px;overflow:hidden;
  background:rgba(20,33,80,.55);
  box-shadow:inset 0 1px 0 rgba(160,200,255,.13), 0 2px 6px rgba(0,0,10,.22)}
.r6 .cal-day{min-height:43px;border-radius:10px}
.r6 .cal-day img{width:22px;height:22px}
.r6 .cal-day .dn{font-size:15px}
.cal-day .dn{font-family:'Barlow Condensed';font-weight:700;font-size:18px;line-height:1;color:#F2F8FF;text-shadow:0 2px 4px rgba(0,0,30,.65)}
.cal-day.out{background:rgba(20,33,80,.26);box-shadow:none}
.cal-day.out .dn{color:rgba(210,230,252,.38);text-shadow:none}
.cal-day.match{background:linear-gradient(150deg,rgba(70,140,230,.75),rgba(50,90,190,.72))}
.cal-day.nextm{outline:2px solid var(--electric);outline-offset:-1px;box-shadow:0 0 14px rgba(59,214,255,.5), inset 0 1px 0 rgba(160,200,255,.13)}
.cal-day img{position:absolute;right:5px;bottom:7px;width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,20,.5))}
.cal-day .hm{position:absolute;left:7px;bottom:8px;font-family:'Inter';font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,30,.6)}
.r6 .cal-day .hm{font-size:11px;bottom:7px}
.cal-day .cb{position:absolute;left:0;right:0;bottom:0;height:4px}
/* finished / past days */
.cal-day.past{background:rgba(10,18,42,.5);box-shadow:none}
.cal-day.past .dn{color:rgba(190,210,235,.42);text-shadow:none}
.cal-day.past.match{background:linear-gradient(150deg,rgba(70,95,135,.42),rgba(50,70,110,.4))}
.cal-day.past img{filter:grayscale(1) opacity(.55)}
.cal-day.past .hm{color:rgba(220,235,255,.5);text-shadow:none}
.cal-day.past .cb{opacity:.35}
.cal-day.past.resW{outline:1.5px solid rgba(87,192,141,.75);outline-offset:-1px}
.cal-day.past.resD{outline:1.5px solid rgba(108,173,223,.75);outline-offset:-1px}
.cal-day.past.resL{outline:1.5px solid rgba(219,107,88,.75);outline-offset:-1px}
.cal-day.past .hm{font-weight:700}
#cal-legend{display:none;gap:13px;align-items:center;margin:0 12px 0 18px;flex:1;font-family:'Barlow Condensed';font-weight:600;font-size:14px;letter-spacing:.06em;color:#CFE4F6;overflow:hidden;white-space:nowrap}
#cal-legend span{display:flex;align-items:center;gap:5px}
#cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* fixtures: match-card view */
#fxcards{margin-top:10px;flex:1;min-height:0;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow:hidden}
.fxcard{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(160deg,rgba(0,24,56,.42),rgba(0,24,56,.66));
  padding:7px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.fxcard.next{border-color:var(--electric);box-shadow:0 0 12px rgba(59,214,255,.35)}
.fxcard .fc-comp{font-family:'Barlow Condensed';font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--steel);text-transform:uppercase}
.fxcard .fc-teams{display:flex;align-items:flex-start;gap:8px;width:100%;justify-content:center}
.fxcard .fc-side{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.fxcard .fc-side img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,20,.5))}
.fxcard .fc-side span{font-size:13px;color:#DCEBF8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fxcard .fc-vs{font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--sky);letter-spacing:.1em;margin-top:9px}
.fxcard .fc-when{font-size:13px;color:var(--sky)}
.fxcard.next .fc-when{color:var(--gold)}
/* right column: compact spotlight + Man City extras */
#right{flex:1;display:flex;flex-direction:column;gap:20px;min-width:0;perspective:1400px}
#spot{transition:transform .5s ease;transform-style:preserve-3d;backface-visibility:hidden}
#spot{flex:1;display:flex;flex-direction:column;padding:12px 18px;min-width:0;position:relative}
#standings{flex:0.98}
#fxpanel{flex:1;padding:14px 20px;display:flex;flex-direction:column;overflow:hidden}
#fxlist{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:18px;color:#DCEBF8}
#fxlist .fxrow{display:flex;align-items:center}
#fxlist .fxrow.next{color:var(--gold)}

function fetchFeed(url,parse,pi){
 pi=pi||0;
 if(pi>=PROXIES.length)return Promise.resolve([]);
 return fetch(PROXIES[pi](url))
  .then(function(r){return r.ok?r.text():null;})
  .then(function(xml){

  })

function parseRss(doc,withThumbs,tag){
 var out=[],items=doc.querySelectorAll("item");
 for(var i=0;i<items.length&&out.length<8;i++){
  var t=items[i].querySelector("title");
  if(!t)continue;
  var raw=t.textContent.trim();
  var stripped=raw.replace(/\s+-\s+[^-]+$/,"").trim();
  var title=(stripped.length>=20)?stripped:raw; /* don't strip a headline into nothing */
  /* junk filters: too short, or just the club name / generic index pages */
  if(title.length<22)continue;
  if(/^man(chester)? city( fc)?([ ,.:|-].{0,20})?$/i.test(title))continue;
  if(/official website|news, fixtures|latest news$/i.test(title))continue;
  var pd=items[i].querySelector("pubDate");
  var ts=pd?new Date(pd.textContent.trim()).getTime():NaN;
  if(!isNaN(ts)&&Date.now()-ts>NEWS_MAX_AGE)continue; /* nothing older than 3 days */
  var th=withThumbs?items[i].getElementsByTagNameNS("*","thumbnail")[0]:null;
  out.push({title:title,img:th?th.getAttribute("url"):null,src:tag,time:isNaN(ts)?new Date().toISOString():new Date(ts).toISOString()});
 }
 return out;
}
/* Local-runner feeds: run_city.py fetches the RSS feeds server-side (no CORS)
   and writes feeds.json next to this file. When that file exists and is fresh
   (<45 min), it wins; otherwise the browser falls back to the proxy chain.
   Hosted (GitHub Pages) builds simply never find feeds.json and work as before. */
function tryLocalFeeds(){
 return fetch("feeds.json?t="+Date.now())
  .then(function(r){return r.ok?r.json():null;})
  .then(function(j){
   if(!j||!j.updated)return false;
   if(Date.now()-new Date(j.updated).getTime()>45*60*1000)return false; /* stale = runner down, use proxies */
   if(j.news&&j.news.length){
    NEWSITEMS=freshOnly(j.news,new Date(j.updated).getTime()).slice(0,12);newsIdx=0;saveLive("news",NEWSITEMS);
    NEWSSTATE={mode:"live",t:new Date(j.updated).getTime()};renderNewsCard();
   }
   if(j.ticker&&j.ticker.length){NEWS=j.ticker;saveLive("ticker",j.ticker);buildTicker();}
   return true;
  }).catch(function(){return false;});
}
function fetchCityNews(){
 tryLocalFeeds().then(function(local){
 if(local)return;
 Promise.all([
  fetchFeed("https://feeds.bbci.co.uk/sport/football/teams/manchester-city/rss.xml",
   function(d){return parseRss(d,true,"BBC");}),
  fetchFeed("https://news.google.com/rss/search?q=%22Manchester+City%22+site:skysports.com&hl=en-GB&gl=GB&ceid=GB:en",
   function(d){return parseRss(d,false,"Sky");}),
  fetchFeed("https://news.google.com/rss/search?q=site:mancity.com&hl=en-GB&gl=GB&ceid=GB:en",
   function(d){return parseRss(d,false,"Club");})
 ]).then(function(lists){
  var merged=[],seen={};
  /* interleave: imaged BBC first so the hero usually has a picture, then club, then sky */
  [lists[0],lists[2],lists[1]].forEach(function(l){
   l.forEach(function(it){
    var key=it.title.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,42);
    if(seen[key])return;
    seen[key]=1;merged.push(it);
   });
  });
  if(merged.length>=3||merged.length>NEWSITEMS.length){
   NEWSITEMS=merged.slice(0,12);newsIdx=0;saveLive("news",NEWSITEMS);
   NEWSSTATE={mode:"live",t:Date.now()};renderNewsCard();
  }
 });
 });
}

   return fetchFeed(YT_RSS,function(doc){
    var out=[],es=doc.querySelectorAll("entry");
    for(var i=0;i<es.length&&out.length<1;i++){
     var idn=es[i].getElementsByTagNameNS("*","videoId")[0];

   }).then(function(a){return a&&a.length?a[0]:null;});

var sbTried=false, SBMETA=null, sbIdx=0, sbCycle=null;
var SB_DWELL=90*1000; /* seconds per clip before rotating to the next */
function sbStop(){if(sbCycle){clearInterval(sbCycle);sbCycle=null;}}
function sbShowClip(){
 var vids=(SBMETA&&SBMETA.videos&&SBMETA.videos.length)?SBMETA.videos:
          (SBMETA&&SBMETA.embed)?[{title:"",src:SBMETA.embed}]:null;

 ifr.allow="autoplay; encrypted-media";

}
function tryScorebat(){
 if(SIGNAGE){showPoster();return;} /* signage: no cross-origin video iframes */
 /* middle layer: latest City match highlights from ScoreBat (server-fetched) */
 if(sbTried){showPoster();return;}
 sbTried=true;
 fetch("scorebat.json?t="+Date.now())
  .then(function(r){return r.ok?r.json():null;})
  .then(function(j){
   if(!j||!j.embed||!j.updated){try{console.log("[vid] scorebat.json missing/empty");}catch(e){}showPoster();return;}
   SBMETA=j;
   if(Date.now()-new Date(j.updated).getTime()>7*24*3600e3){try{console.log("[vid] scorebat stale");}catch(e){}showPoster();return;}
   try{console.log("[vid] scorebat: "+j.match+" ("+((j.videos&&j.videos.length)||1)+" clips)");}catch(e){}
   if(ytTryTimer){clearTimeout(ytTryTimer);ytTryTimer=null;}
   try{if(ytPlayer&&ytPlayer.destroy)ytPlayer.destroy();}catch(e){}
   ytPlayer=null;
   sbIdx=0;sbShowClip();
   /* continuous playback: rotate through the match's clips forever */
   sbStop();sbCycle=setInterval(function(){sbIdx++;sbShowClip();},SB_DWELL);
  }).catch(function(){showPoster();});
}

 /* the guaranteed path: a thumbnail + title from whatever source we know about */
 try{console.log("[vid] poster mode");}catch(e){}

 if(ytTryTimer){clearTimeout(ytTryTimer);ytTryTimer=null;}

function buildYt(){
 if(ytApiTimer){clearTimeout(ytApiTimer);ytApiTimer=null;}
 var h=document.getElementById("news-iframe");
 if(!h||h.tagName==="IFRAME")return;
 ytPlayer=new YT.Player("news-iframe",{
  playerVars:{autoplay:1,mute:1,controls:0,rel:0,modestbranding:1,playsinline:1},
  events:{
   onReady:function(e){
    e.target.mute();
    try{e.target.unloadModule("captions");e.target.unloadModule("cc");}catch(x){}
    try{console.log("[vid] trying latest: "+LATESTVIDEO.id);}catch(x){}
    e.target.loadVideoById(LATESTVIDEO.id);
    /* one chance: playing within 10s or we go to the poster */
    ytTryTimer=setTimeout(function(){
     try{
      if(!ytPlayer||ytPlayer.getPlayerState()!==1)tryScorebat();
     }catch(x){tryScorebat();}
    },10000);
    fitVideoCover();setTimeout(fitVideoCover,600);
   },
   onStateChange:function(e){
    if(e.data===1){ /* playing: success */
     if(ytTryTimer){clearTimeout(ytTryTimer);ytTryTimer=null;}
     hidePoster();
     try{e.target.unloadModule("captions");e.target.unloadModule("cc");}catch(x){}
    }
    if(e.data===0){ /* ended: loop the latest */
     try{e.target.seekTo(0,true);e.target.playVideo();}catch(x){}
    }
   },
   onError:function(e){
    try{console.log("[vid] embed refused ("+e.data+")");}catch(x){}
    tryScorebat();
   }
  }
 });
}
var vidGen=0;
function fetchLatestVideo(){
 var body=document.getElementById("vidbody");
 if(document.getElementById("news-iframe"))return;
 var gen=++vidGen; /* stale attempts (slow proxies resolving late) must never touch the card */
 getLatestVideo().then(function(v){
  if(gen!==vidGen){try{console.log("[vid] stale attempt ignored");}catch(e){}return;}
  if(document.getElementById("news-iframe"))return; /* something already built meanwhile */
  if(!v){ /* couldn't even discover the latest YouTube id: straight to ScoreBat */
   try{console.log("[vid] no video id available - trying scorebat");}catch(e){}
   tryScorebat();return;
  }
  LATESTVIDEO=v;
  var holder=document.createElement("div");
  holder.id="news-iframe";
  body.appendChild(holder);
  document.getElementById("news-play").style.display="none";
  if(SIGNAGE){showPoster();return;} /* signage: poster only, no player */
  if(window.YT&&YT.Player){buildYt();}
  else{
   var s=document.createElement("script");
   s.src="https://www.youtube.com/iframe_api";
   document.head.appendChild(s);
   window.onYouTubeIframeAPIReady=buildYt;
   /* player script never arrives: poster, not a dead iframe */
   ytApiTimer=setTimeout(function(){if(!(window.YT&&YT.Player))tryScorebat();},8000);
  }
 });
}

function fetchNewsJson(){
 fetch("news.json?t="+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(j){
  if(!j||!j.items||!j.items.length)return;
  if(j.updated&&Date.now()-new Date(j.updated).getTime()>NEWS_MAX_AGE)return; /* dated file older than 3 days: ignore */
  var items=j.items.filter(function(s){ /* never show template/instructional lines */
   return !/news\.json|edit this (file|line)|update the ticker|placeholder/i.test(String(s));
  });
  if(items.length){NEWS=items;buildTicker();}
 }).catch(function(){});
}
function fetchNews(){
 /* Route 0: local runner feeds.json. Route 1: Google News RSS via CORS proxy. Fallback: news.json. */
 tryLocalFeeds().then(function(local){
 if(local)return;
 var rss="https://news.google.com/rss/search?q=%22Manchester+City%22&hl=en-GB&gl=GB&ceid=GB:en";
 fetchFeed(rss,function(doc){
  var items=doc.querySelectorAll("item");
  var out=[];
  for(var i=0;i<items.length&&out.length<8;i++){
   var tt=items[i].querySelector("title");if(!tt)continue;
   var pd=items[i].querySelector("pubDate");
   var ts=pd?new Date(pd.textContent.trim()).getTime():NaN;
   if(!isNaN(ts)&&Date.now()-ts>NEWS_MAX_AGE)continue;
   var t=tt.textContent.replace(/\s+-\s+[^-]+$/,"").trim();
   if(t)out.push(t);
  }
  return out;
 }).then(function(out){
  if(out.length){NEWS=out;saveLive("ticker",out);buildTicker();}
  else fetchNewsJson();
 });
 });
}
